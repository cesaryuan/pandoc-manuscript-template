name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build and publish
    runs-on: windows-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install Python
        run: uv python install 3.11

      - name: Check Rust toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - name: Build distributions
        run: uv build

      # Smoke-test both artifacts so packaged resources are checked before upload.
      - name: Smoke test wheel
        run: |
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          uv run --isolated --no-project --with $wheel pmt --help

      - name: Smoke test source distribution
        run: |
          $sdist = (Get-ChildItem dist\*.tar.gz | Select-Object -First 1).FullName
          uv run --isolated --no-project --with $sdist pmt --help

      - name: Publish to PyPI
        run: uv publish
