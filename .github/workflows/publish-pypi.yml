name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build-wheels:
    name: Build ${{ matrix.os }} wheel
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_SUBMODULES_TOKEN }}
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install Python
        run: uv python install 3.11

      - name: Set macOS 14 deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Prevent a newer macOS SDK from producing helpers that macOS 14.6
          # cannot load when the floating macos-latest image advances.
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"

      # Cargo fetches Git dependencies in its own cache, outside checkout's
      # credential scope. Keep the rewrite limited to the private dependency.
      - name: Authenticate private Cargo dependencies
        shell: bash
        env:
          PRIVATE_SUBMODULES_TOKEN: ${{ secrets.PRIVATE_SUBMODULES_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${PRIVATE_SUBMODULES_TOKEN}@github.com/cesaryuan/latex2wmf".insteadOf \
            "https://github.com/cesaryuan/latex2wmf"

      - name: Check Rust toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - name: Check .NET SDK for the Windows helper
        if: runner.os == 'Windows'
        run: dotnet --version

      - name: Build platform wheel
        run: uv build --wheel

      - name: Verify macOS 14 native helper compatibility
        if: runner.os == 'macOS'
        shell: bash
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          helper_dir="$(mktemp -d)"
          trap 'rm -rf "$helper_dir"' EXIT
          unzip -q "$wheel" 'pandoc_manuscript/mathtype/bin/mathtype-rust' 'pandoc_manuscript/mathtype/bin/latex2wmf' -d "$helper_dir"
          for helper in "$helper_dir"/pandoc_manuscript/mathtype/bin/*; do
            min_os="$(otool -l "$helper" | awk '$1 == "minos" || $1 == "version" { print $2; exit }')"
            if [[ "$min_os" != 14.* ]]; then
              echo "Expected macOS 14 deployment target for $helper, got ${min_os:-missing}." >&2
              exit 1
            fi
          done

      - name: Smoke test packaged native helpers
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          uv run --isolated --no-project --with $wheel pmt --help
          uv run --isolated --no-project --with $wheel python -c "from pandoc_manuscript.mathtype.ole_parts import check_mathtype_availability; assert check_mathtype_availability('rust').usable"

      - name: Verify binary-only wheel contents
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          # Wheels are ZIP archives. GNU tar on Ubuntu cannot read them, unlike
          # the BSD tar implementations currently available on macOS and Windows.
          $entries = python -c @'
          import sys
          from zipfile import ZipFile

          # Windows CI can redirect Python output through cp1252 even when a
          # wheel contains Unicode paths. Escaping keeps the archive listing
          # readable by PowerShell without changing its ASCII runtime entries.
          sys.stdout.reconfigure(errors="backslashreplace")
          with ZipFile(sys.argv[1]) as wheel:
              print("\n".join(wheel.namelist()))
          '@ $wheel
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          foreach ($name in @("mathtype-rust$suffix", "latex2wmf$suffix")) {
            if (-not ($entries -match "pandoc_manuscript/mathtype/bin/$name")) {
              throw "Wheel is missing native runtime: $name"
            }
          }
          if ($IsWindows -and -not ($entries -match 'pandoc_manuscript/mathtype/ole_helper/bin/Release/net48/MathTypeOleHelper.exe')) {
            throw 'Windows wheel is missing MathTypeOleHelper.exe'
          }
          $forbidden = $entries | Where-Object {
            $_ -match 'scripts/(mathtype-rust|latex2wmf)/' -or
            $_ -match 'pandoc_manuscript/mathtype/ole_helper/.*\.(cs|csproj|pdb|config)$'
          }
          if ($forbidden) {
            throw "Wheel contains native helper source/debug files: $($forbidden -join ', ')"
          }

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ runner.os }}
          path: dist/*.whl
          if-no-files-found: error

  build-linux-wheel:
    name: Build manylinux_2_28 wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_SUBMODULES_TOKEN }}
          submodules: recursive

      # Build inside the manylinux container so the bundled Rust executables
      # genuinely support glibc 2.28 instead of merely carrying an older tag.
      - name: Build Linux wheel
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_BUILD: cp311-manylinux_x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: curl -sSf https://sh.rustup.rs | sh -s -- -y
          # The Cargo build happens in the manylinux container rather than on
          # the runner, so pass its private-repository token explicitly.
          PRIVATE_SUBMODULES_TOKEN: ${{ secrets.PRIVATE_SUBMODULES_TOKEN }}
          CIBW_ENVIRONMENT_LINUX: PATH=$HOME/.cargo/bin:$PATH
          CIBW_ENVIRONMENT_PASS_LINUX: PRIVATE_SUBMODULES_TOKEN
          CIBW_BEFORE_BUILD_LINUX: >-
            git config --global
            url."https://x-access-token:${PRIVATE_SUBMODULES_TOKEN}@github.com/cesaryuan/latex2wmf".insteadOf
            "https://github.com/cesaryuan/latex2wmf"
        with:
          output-dir: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install Python
        run: uv python install 3.11

      - name: Smoke test packaged native helpers
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          uv run --isolated --no-project --with $wheel pmt --help
          uv run --isolated --no-project --with $wheel python -c "from pandoc_manuscript.mathtype.ole_parts import check_mathtype_availability; assert check_mathtype_availability('rust').usable"

      - name: Verify Linux wheel contents and compatibility tag
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          if ($wheel.Name -notmatch 'manylinux_2_28_x86_64') {
            throw "Linux wheel does not have the expected manylinux_2_28_x86_64 tag: $($wheel.Name)"
          }
          $entries = python -c @'
          import sys
          from zipfile import ZipFile

          with ZipFile(sys.argv[1]) as wheel:
              print("\n".join(wheel.namelist()))
          '@ $wheel.FullName
          foreach ($name in @("mathtype-rust", "latex2wmf")) {
            if (-not ($entries -match "pandoc_manuscript/mathtype/bin/$name")) {
              throw "Wheel is missing native runtime: $name"
            }
          }
          $forbidden = $entries | Where-Object {
            $_ -match 'scripts/(mathtype-rust|latex2wmf)/' -or
            $_ -match 'pandoc_manuscript/mathtype/ole_helper/.*\.(cs|csproj|pdb|config)$'
          }
          if ($forbidden) {
            throw "Wheel contains native helper source/debug files: $($forbidden -join ', ')"
          }

      - name: Upload Linux wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-Linux
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish platform wheels
    needs: [build-wheels, build-linux-wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        # Native helper sources are intentionally not distributed. Publishing
        # wheels only avoids creating an incomplete, non-buildable sdist.
        run: uv publish dist/*.whl
