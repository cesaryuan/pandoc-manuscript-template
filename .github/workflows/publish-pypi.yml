name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: Install Python
        run: uv python install 3.11

      - name: Build distributions
        run: uv build

      # Smoke-test both artifacts so packaged resources are checked before upload.
      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl pmt --help

      - name: Smoke test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz pmt --help

      - name: Publish to PyPI
        run: uv publish
