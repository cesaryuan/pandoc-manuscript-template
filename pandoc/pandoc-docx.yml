# Pandoc DOCX output configuration
# Usage: pandoc --defaults pandoc.yml

verbosity: WARNING
input-files:
  - manuscript.md

output-file: output/docx/manuscript.docx
standalone: true
reference-doc: pandoc/manuscript-template/reference-doc.docx
# Custom XML template for DOCX formatting
template: pandoc/templates/default.xml

# Filters are applied in order
filters:
  - pandoc-crossref  # Must come before citeproc
  - citeproc