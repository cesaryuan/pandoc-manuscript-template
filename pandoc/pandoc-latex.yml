# Pandoc LaTeX output configuration
# Usage: pandoc --defaults pandoc-latex.yml

verbosity: WARNING
data-dir: ${.}/

standalone: true
cite-method: natbib
number-sections: true

# Filters are applied in order
filters:
  - pandoc-crossref  # Must come before citeproc for cross-references
  - ${.}/filters/shared/normalize_chinese_numbering.lua
  - ${.}/filters/shared/merge_table_cells.lua
  - ${.}/filters/latex/emf_to_pdf.py    # Converts EMF images to PDF for LaTeX
  - ${.}/filters/latex/resource_move.py # Copies resources to output directory
  - ${.}/filters/latex/table_convert.py # Converts tables to LaTeX format

# Template customization (uncomment to use custom template)
# template: pandoc/default.tex
