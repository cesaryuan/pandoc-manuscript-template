[project]
name = "pandoc-manuscript-template"
version = "0.1.0"
description = "Pandoc Markdown manuscript template with DOCX-focused post-processing"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "python-docx>=1.1.0",
  "pyyaml>=6.0",
  "lxml>=4.9.0",
  "panflute>=2.3.0",
  "pymupdf>=1.26.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
  "resvg-py>=0.3.3",
]

[project.scripts]
pmt = "pandoc_manuscript.cli:main"
pandoc-manuscript = "pandoc_manuscript.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  ".git",
  ".pandoc-cache",
  ".vscode",
  "output",
  "tmp",
  "**/__pycache__",
  "**/*.pyc",
  "scripts/mathtype-rust/target",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pandoc_manuscript"]

[tool.hatch.build.targets.wheel.force-include]
"pandoc" = "pandoc_manuscript/pandoc"
"template" = "pandoc_manuscript/_template"
