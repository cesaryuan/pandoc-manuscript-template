[project]
name = "pandoc-manuscript-template"
version = "0.1.0"
description = "Pandoc Markdown manuscript template with DOCX-focused post-processing"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "python-docx>=1.1.0",
  "pyyaml>=6.0",
  "lxml>=4.9.0",
  "panflute>=2.3.0",
  "pymupdf>=1.26.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
pmt = "pandoc_manuscript.cli:main"
pandoc-manuscript = "pandoc_manuscript.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  ".git",
  ".pandoc-cache",
  ".vscode",
  "output",
  "tmp",
  "**/__pycache__",
  "**/*.pyc",
  "scripts/mathtype-rust/target",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pandoc_manuscript"]

[tool.hatch.build.targets.wheel.force-include]
"pandoc" = "pandoc_manuscript/_template/pandoc"
"examples" = "pandoc_manuscript/_template/examples"
"manuscript.md" = "pandoc_manuscript/_template/manuscript.md"
"style.yml" = "pandoc_manuscript/_template/style.yml"
"README.md" = "pandoc_manuscript/_template/README.md"
"Makefile" = "pandoc_manuscript/_template/Makefile"
".gitignore" = "pandoc_manuscript/_template/.gitignore"
"src/pandoc_manuscript/mathtype/mathtype_markers.lua" = "pandoc_manuscript/mathtype/mathtype_markers.lua"
"src/pandoc_manuscript/mathtype/Times+Symbol 12.eqp" = "pandoc_manuscript/mathtype/Times+Symbol 12.eqp"
"src/pandoc_manuscript/mathtype_ole_helper" = "pandoc_manuscript/mathtype_ole_helper"
