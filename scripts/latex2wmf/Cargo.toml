[package]
name = "latex2wmf"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Cross-platform LaTeX formula renderer for MathType-compatible WMF previews"

[dependencies]
lyon_path = "1.0.16"
mitex = "0.2.4"
ratex-layout = "0.1.13"
ratex-parser = "0.1.13"
ratex-svg = { version = "0.1.13", features = ["embed-fonts"] }
ratex-types = "0.1.13"
serde_json = "1.0.145"
tiny-skia-path = "0.12.0"
typst-as-lib = { version = "0.16.0", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-layout = "0.15.0"
typst-svg = "0.15.0"
usvg = { version = "0.47.0", default-features = false }

