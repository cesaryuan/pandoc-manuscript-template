# Default output style metadata.
#
# Keep manuscript-specific metadata in manuscript.md. Values defined in the
# manuscript YAML header override these defaults during the build.

reference-section-title: References
link-citations: true
# Citation Style Language (CSL) file
# Default: Vancouver style (numeric citations)
# Common alternatives:
#   - pandoc/csl/elsevier-vancouver.csl (Vancouver)
#   - pandoc/csl/engineering-applications-of-artificial-intelligence.csl (EA-AI journal)
#   - Or download from https://www.zotero.org/styles
csl: pandoc/csl/elsevier-vancouver.csl
# Override citeproc's fixed en dash in collapsed numeric citation ranges.
# Set "-" for hyphen ranges such as [1-3], or "–" to keep the CSL default.
citation-number-range-delimiter: "–"

# Set to true to convert DOCX equations to MathType OLE objects during build.
mathtype: true

# Set to true for continuous DOCX line numbers, or use a string such as
# '连续', '每页重编', '每节重编', 'continuous', 'restart-page', or 'restart-section'.
show-line-numbers: '连续'
# DOCX paragraph style formatting (applied by exact style name in post-processing)
docxStyle:
  标题 1: { fontSize: 小四 }
  标题 2: { fontSize: 小四 }
  正文文本:
    firstLineIndentChars: 2
    paragraphSpacing:
      before: 0pt
      after: 0pt

# Pandoc-crossref settings for cross-references
## Item caption prefix format: {figureTitle} {number}{titleDelim} {caption}
figureTitle: "Figure "
tableTitle: "Table "
titleDelim: ""
## Item cross-reference format
figPrefix: "Figure"
tblPrefix: "Table"
secPrefix: "Section"
eqnPrefix: "Equation"
# Support for centered equations and right-aligned numbering
tableEqns: true
## 表格排版公式
# eqnBlockTemplate: | # 用表格排版公式，能正确显示 Display Math
#   +:------+:--------------------------------------------------:+--------:+
#   |       | $$t$$                                              | $$nmi$$ |
#   +-------+----------------------------------------------------+---------+
## 制表符排版 Word 公式
# eqnBlockTemplate: | # 用制表符排版公式，不需要后处理脚本，但是 Display Math 在 docx 中会显示为行内公式
#    `<w:pPr><w:tabs><w:tab w:val="center" w:leader="none" w:pos="4888" /><w:tab w:val="right" w:leader="none" w:pos="9746" /></w:tabs></w:pPr><w:r><w:tab /></w:r>`{=openxml} $$t$$ `<w:r><w:tab /></w:r>`{=openxml} $$nmi$$
# eqnBlockInlineMath: true    # Support for centered equations and right-aligned numbering
## 制表符排版 Mathtype 公式
eqnBlockTemplate: | # 用制表符排版公式，不需要后处理脚本，但是 Display Math 在 docx 中会显示为行内公式
   `<w:pPr><w:tabs><w:tab w:val="center" w:leader="none" w:pos="4888" /><w:tab w:val="right" w:leader="none" w:pos="9746" /></w:tabs></w:pPr><w:r><w:tab /></w:r>`{=openxml}$$t$$`<w:r><w:tab /></w:r>`{=openxml}$$nmi$$
eqnBlockInlineMath: true    # Support for centered equations and right-aligned numbering

## Options for section numbering and auto-labeling
linkReferences: true        # Convert references to hyperlinks
autoSectionLabels: true     # Auto-add "sec:" prefix to section labels
autoEqnLabels: true         # Number all display equations
numberSections: true        # Number sections. Add 1.1., 1.2., etc.
sectionsDepth: 3            # Depth of numbered sections
subfigGrid: true            # Subfigure grid layout support
subfigureChildTemplate: ($$i$$) $$t$$
subfigureTemplate: $$figureTitle$$ $$i$$$$titleDelim$$ $$t$$

# Reviewer reply output overrides. `pmt build reply` merges the top-level
# metadata above with this section, and these values take precedence for replies.
reply:
  mathtype: true
  docxStyle:
    正文文本:
      firstLineIndentChars: 0
      paragraphSpacing:
        before: 6pt
        after: 6pt
  figPrefix: "Figure"
  tblPrefix: "Table"
  secPrefix: "Section"
  eqnPrefix: "Equation"

