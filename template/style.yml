# Default output style metadata.
#
# Keep manuscript-specific metadata in manuscript.md. Values defined in the
# manuscript YAML header override these defaults during the build.

# Override citeproc's fixed en dash in collapsed numeric citation ranges.
# Set "-" for hyphen ranges such as [1-3], or "–" to keep the CSL default.
citation-number-range-delimiter: "–"

# Set to true to convert DOCX equations to MathType OLE objects during build.
# The default stays false so a freshly initialized project builds without a
# local MathType/OLE conversion setup.
mathtype: true
# MathType conversion backend: rust, set-data, auto, or both.
# rust: LaTeX -> mathtype-rust -> OLE/MTEF -> MathType SDK WMF/JSON.
# set-data: LaTeX -> MathType OLE TeX input -> OLE/WMF/JSON.
# auto: try set-data first, then fall back to rust.
# both: generate both backends, warn if OLE/JSON differ, and use set-data.
mathtypeConversionMethod: both

# Set to true to inline local child images inside referenced SVG files during
# DOCX builds. This keeps SVG text/vector elements sharp while making linked
# child images visible in Word. Automatically disabled when docxConvertSvgToPng
# is true.
docxEmbedSvgImages: true

# Set to true to rasterize every referenced SVG image to PNG during DOCX builds.
# Use `{to-png=true}` on a single image when only one SVG needs rasterization.
# Add `to-png-scale=2` on that image to override the global PNG scale.
docxConvertSvgToPng: false
# Enable at most one of the following SVG-to-PNG sizing controls.
# docxSvgToPngWidth: 1600
# docxSvgToPngDpi: 300
# docxSvgToPngScale: 1

# Set to true for continuous DOCX line numbers, or use a string such as
# '连续', '每页重编', '每节重编', 'continuous', 'restart-page', or 'restart-section'.
show-line-numbers: '连续'

# DOCX page margins written into the reference DOCX before Pandoc conversion.
docxPageMargins:
  top: 2.54cm
  bottom: 2.54cm
  left: 3.17cm
  right: 3.17cm

# DOCX paragraph style formatting (applied by exact style name in post-processing)
docxStyle:
  标题 1: { fontSize: 小四 }
  标题 2: { fontSize: 小四 }
  正文文本:
    firstLineIndentChars: 2
    paragraphSpacing:
      before: 0pt
      after: 0pt
# Reviewer reply output overrides. `pmt build reply` merges the top-level
# metadata above with this section, and these values take precedence for replies.
reply:
  docxStyle:
    正文文本:
      firstLineIndentChars: 0
      paragraphSpacing:
        before: 6pt
        after: 6pt
        
# Pandoc-crossref settings for cross-references
## Item caption prefix format: {figureTitle} {number}{titleDelim} {caption}
figureTitle: "Figure "
tableTitle: "Table "
titleDelim: ""
## Item cross-reference format
figPrefix: "Figure"
tblPrefix: "Table"
secPrefix: "Section"
eqnPrefix: "Equation"
# Support for centered equations and right-aligned numbering
tableEqns: true
## 表格排版公式
# eqnBlockTemplate: | # 用表格排版公式，能正确显示 Display Math
#   +:------+:--------------------------------------------------:+--------:+
#   |       | $$t$$                                              | $$nmi$$ |
#   +-------+----------------------------------------------------+---------+
## 制表符排版 Word 公式
# eqnBlockTemplate: | # 用制表符排版公式，不需要后处理脚本，但是 Display Math 在 docx 中会显示为行内公式
#    `<w:pPr><w:tabs><w:tab w:val="center" w:leader="none" w:pos="4156" /><w:tab w:val="right" w:leader="none" w:pos="8312" /></w:tabs></w:pPr><w:r><w:tab /></w:r>`{=openxml} $$t$$ `<w:r><w:tab /></w:r>`{=openxml} $$nmi$$
# eqnBlockInlineMath: true    # Support for centered equations and right-aligned numbering
## 制表符排版 Mathtype 公式
eqnBlockTemplate: | # 用制表符排版公式，不需要后处理脚本，但是 Display Math 在 docx 中会显示为行内公式
   `<w:pPr><w:tabs><w:tab w:val="center" w:leader="none" w:pos="4156" /><w:tab w:val="right" w:leader="none" w:pos="8312" /></w:tabs></w:pPr><w:r><w:tab /></w:r>`{=openxml}$$t$$`<w:r><w:tab /></w:r>`{=openxml}$$nmi$$
eqnBlockInlineMath: true    # Support for centered equations and right-aligned numbering

## Options for section numbering and auto-labeling
linkReferences: true        # Convert references to hyperlinks
autoSectionLabels: true     # Auto-add "sec:" prefix to section labels
autoEqnLabels: true         # Number all display equations
numberSections: true        # Number sections. Add 1.1., 1.2., etc.
sectionsDepth: 3            # Depth of numbered sections
subfigGrid: true            # Subfigure grid layout support
subfigureChildTemplate: ($$i$$) $$t$$
subfigureTemplate: $$figureTitle$$ $$i$$$$titleDelim$$ $$t$$

# Options for bibliography
reference-section-title: References
link-citations: true
# Citation Style Language (CSL) file
# Default: Vancouver style (numeric citations)
# You can download csl files from https://www.zotero.org/styles
# csl: path/to/your.csl
